name: family-manager

services:
  app:
    build:
      context: .
    env_file:
      - ${FM_ENV_FILE:-.env.dev}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DEMO_MODE: "false"
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-4001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
